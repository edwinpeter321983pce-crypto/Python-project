<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PraiseAI - Next-Generation AI Assistant</title>
    <style>
        :root { background-color: #0b0f19; color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; }
        body { margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; border-bottom: 1px solid #1f2937; background: #111827; }
        .logo-area { display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 1.25rem; color: #fff; }
        .cross-logo { width: 24px; height: 24px; background: #3b82f6; display: flex; align-items: center; justify-content: center; border-radius: 4px; color: white; font-weight: bold; }
        .chat-container { flex: 1; display: flex; flex-direction: column; max-width: 800px; margin: 0 auto; width: 100%; padding: 1rem; box-sizing: border-box; overflow: hidden; }
        .chat-box { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 1rem; scroll-behavior: smooth; }
        .message { padding: 0.75rem 1rem; border-radius: 8px; max-width: 75%; line-height: 1.5; word-wrap: break-word; }
        .user-msg { background: #3b82f6; color: white; align-self: flex-end; }
        .ai-msg { background: #1f2937; color: #e5e7eb; align-self: flex-start; border: 1px solid #374151; }
        .input-area { display: flex; gap: 0.5rem; padding: 1rem 0; border-top: 1px solid #1f2937; }
        input[type="text"] { flex: 1; padding: 0.75rem 1rem; border-radius: 8px; border: 1px solid #374151; background: #111827; color: white; outline: none; font-size: 1rem; }
        input[type="text"]:focus { border-color: #3b82f6; }
        button { padding: 0.75rem 1.5rem; border-radius: 8px; border: none; background: #3b82f6; color: white; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #2563eb; }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <div class="cross-logo">┼</div>
            <span>PraiseAI</span>
        </div>
        <div style="font-size: 0.875rem; color: #9ca3af;">Multimodal Web Engine</div>
    </header>

    <div class="chat-container">
        <div class="chat-box" id="chatBox">
            <div class="message ai-msg">Hello! I am PraiseAI. How can I help you build or code today?</div>
        </div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Ask PraiseAI anything..." autofocus>
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');

        userInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendMessage();
        });

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Append User Message
            appendMessage(text, 'user-msg');
            userInput.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: text })
                });
                const data = await response.json();
                appendMessage(data.reply, 'ai-msg');
            } catch (error) {
                appendMessage("Error connecting to server backend.", 'ai-msg');
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function appendMessage(text, className) {
            const div = document.createElement('div');
            div.className = `message ${className}`;
            div.innerText = text;
            chatBox.appendChild(div);
        }
    </script>
</body>
</html>
